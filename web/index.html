<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pokeportal</title>
    <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
    <!--
      Per PLAN_EVAL S5 A13 / R2: preload the Pokemon GB font so first-paint
      has the best chance of landing it under `font-display: optional`.
      `crossorigin` is required even for same-origin font preloads.
    -->
    <link
      rel="preload"
      href="./public/fonts/pokemon-gb.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app" tabindex="-1"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
